name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add real features to the web app
        run: | cp app.js www/app.js grep -q 'app.js' www/index.html || sed -i 's#</body>#<script src="app.js"></script></body>#' www/index.html 
      - name: Add Android platform
        run: npx cap add android

      - name: Add permissions (camera, location)
        run: | F=android/app/src/main/AndroidManifest.xml sed -i 's#</manifest># <uses-permission android:name="android.permission.CAMERA" />\n <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n <uses-permission android:name="android.permission.VIBRATE" />\n <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $F grep -c 'permission.CAMERA' $F 
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0905' --splashBackgroundColor '#050505'

      - name: Sync web files
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalGold-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
