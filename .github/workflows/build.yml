name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy features file
        run: cp app.js www/app.js

      - name: Link features file in index.html
        run: sed -i 's#</body>#<script src="app.js"></script></body>#' www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Add permissions
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /><uses-permission android:name="android.permission.VIBRATE" /></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0905' --splashBackgroundColor '#050505'

      - name: Sync web files
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalGold-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
